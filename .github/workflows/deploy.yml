name: Deploy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      WASSUP_TAG: ${{ github.ref_name }}
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: WASSUP_TAG
          script: |
            set -euo pipefail
            # The /opt/app stack is owned by the giavang365 monorepo. This job
            # only moves wassup's pinned tag and restarts wassup.
            if ! printf '%s' "$WASSUP_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "refusing to deploy non-release ref '$WASSUP_TAG'" >&2
              exit 1
            fi
            cd /opt/app
            grep -q 'WASSUP_TAG' compose.yml || { echo "compose.yml does not pin WASSUP_TAG" >&2; exit 1; }
            if grep -q '^WASSUP_TAG=' .env; then
              sed -i "s/^WASSUP_TAG=.*/WASSUP_TAG=${WASSUP_TAG}/" .env
            else
              echo "WASSUP_TAG=${WASSUP_TAG}" >> .env
            fi
            docker compose pull wassup
            docker compose up -d --no-deps wassup
            sleep 15
            docker compose exec wassup node -e "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1); console.log('Health check passed') }).catch(() => process.exit(1))"
            docker image prune -f
